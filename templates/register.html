<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | Smart Medicine Reminder</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 20px;

            background:
                linear-gradient(
                    rgba(0, 80, 75, 0.55),
                    rgba(0, 35, 55, 0.65)
                ),
                url("/static/images/register.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }


        /* Register Card */

        .register-card {

            width: 100%;
            max-width: 400px;

            padding: 35px;

            background: rgba(255, 255, 255, 0.16);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.3);

            border-radius: 20px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.3);

            color: white;
        }


        /* Logo */

        .logo {

            text-align: center;

            font-size: 45px;

            margin-bottom: 8px;
        }


        /* Heading */

        h1 {

            text-align: center;

            font-size: 28px;

            margin-bottom: 8px;
        }

        .subtitle {

            text-align: center;

            font-size: 14px;

            color: #eeeeee;

            margin-bottom: 25px;
        }


        /* Input */

        .input-group {

            margin-bottom: 16px;
        }

        label {

            display: block;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 7px;
        }

        input {

            width: 100%;

            padding: 13px 14px;

            border: none;

            outline: none;

            border-radius: 9px;

            background: rgba(255, 255, 255, 0.95);

            color: #222;

            font-size: 15px;

            transition: 0.3s;
        }

        input::placeholder {

            color: #777;
        }

        input:focus {

            box-shadow:
                0 0 0 3px rgba(0, 184, 148, 0.35);
        }


        /* Register Button */

        .register-btn {

            width: 100%;

            padding: 13px;

            margin-top: 5px;

            border: none;

            border-radius: 9px;

            background: #00b894;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .register-btn:hover {

            background: #009f82;

            transform: translateY(-2px);

            box-shadow:
                0 6px 15px rgba(0, 0, 0, 0.2);
        }


        /* Login Link */

        .login-text {

            text-align: center;

            margin-top: 20px;

            font-size: 14px;

            color: #eeeeee;
        }

        .login-text a {

            color: #fff176;

            text-decoration: none;

            font-weight: bold;
        }

        .login-text a:hover {

            text-decoration: underline;
        }


        /* Responsive */

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .register-card {

                padding: 28px 22px;

            }

            h1 {

                font-size: 24px;

            }

            .logo {

                font-size: 40px;

            }

        }

    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


    <div class="register-card">


        <!-- Medical Icon -->

        <div class="logo">
            💊
        </div>


        <!-- Heading -->

        <h1>
            Create Account
        </h1>

        <p class="subtitle">
            Join Smart Medicine Reminder
        </p>


        <!-- Register Form -->

        <form method="POST">


            <!-- Username -->

            <div class="input-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <!-- Password -->

            <div class="input-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <!-- Confirm Password -->

            <div class="input-group">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <!-- Register -->

            <button
                type="submit"
                class="register-btn"
            >
                Create Account
            </button>


        </form>


        <!-- Login -->

        <div class="login-text">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </div>


    </div>


</body>

</html>
